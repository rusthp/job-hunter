<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Hunter — RH / Financeiro / Gestão</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="hero">
      <h1 id="greeting">Início</h1>
      <p id="last-collected">Carregando...</p>
    </div>

    <section class="stats" id="stats-cards"></section>

    <section class="recommended-section">
      <h2>Recomendadas pra você</h2>
      <p class="hint" id="recommended-hint"></p>
      <div class="recommended-grid" id="recommended-grid"></div>
    </section>

    <details class="chart-section">
      <summary>Atividade — vagas coletadas nos últimos 30 dias</summary>
      <div class="card">
        <h3>Performance</h3>
        <p class="hint">Vagas novas coletadas por dia</p>
        <div id="chart-wrap"></div>
      </div>
    </details>

    <section class="breakdown">
      <div class="card">
        <h3>Tipo de contrato</h3>
        <div id="contract-breakdown"></div>
      </div>
      <div class="card">
        <h3>Modalidade</h3>
        <div id="workplace-breakdown"></div>
      </div>
      <div class="card">
        <h3>Senioridade (inferida do título)</h3>
        <div id="seniority-breakdown"></div>
      </div>
    </section>

    <div class="prompt-filter card">
      <label for="prompt-input">Busca por prompt (linguagem natural)</label>
      <div class="prompt-row">
        <input id="prompt-input" type="text" placeholder='Ex: "vagas remotas de RH sênior em São Paulo"' />
        <button class="btn btn-primary" id="prompt-go" type="button">Interpretar</button>
      </div>
      <div id="prompt-status" class="hint"></div>
      <div id="prompt-applied"></div>
    </div>

    <div class="tabs" id="jobs-tabs">
      <button class="tab-btn active" data-tab="all" type="button">Vagas</button>
      <button class="tab-btn" data-tab="applied" type="button">Enviadas</button>
    </div>

    <div class="filters">
      <input id="q" type="text" placeholder="Buscar por cargo ou empresa..." />
      <select id="f-contract" title="Filtrar por tipo de contrato"><option value="">Tipo de contrato: todos</option></select>
      <select id="f-workplace" title="Filtrar por modalidade"><option value="">Modalidade: todas</option></select>
      <select id="f-state" title="Filtrar por estado"><option value="">Estado: todos</option></select>
      <select id="f-seniority" title="Filtrar por senioridade"><option value="">Senioridade: todas</option></select>
      <label id="show-all-wrap" style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
        <input type="checkbox" id="show-all" /> Mostrar vagas fora da política (Configurações)
      </label>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Vaga</th>
            <th>Empresa</th>
            <th>Contrato</th>
            <th>Modalidade</th>
            <th>Senioridade</th>
            <th>Local</th>
            <th>Publicada</th>
            <th>Match</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>
</div>

<script src="sidebar.js"></script>
<script>
renderSidebar('index.html');
let PROFILE_ID = null;

function greetingPrefix() {
  const h = new Date().getHours();
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function matchClass(m) {
  if (m === null || m === undefined) return 'low';
  if (m >= 60) return 'high';
  if (m >= 30) return 'mid';
  return 'low';
}

async function loadHero() {
  const profile = await fetch(`api/profiles/${PROFILE_ID}`).then(r => r.json());
  document.getElementById('greeting').textContent = `${greetingPrefix()}, ${profile.name}.`;

  const allJobs = (await fetch(`api/jobs?profile_id=${PROFILE_ID}&show_all=1&page_size=1000`).then(r => r.json())).items;
  const eligible = allJobs.filter(j => !j.excluded_by_policy);
  const compatible = eligible.filter(j => j.match !== null && j.match > 0);
  const highMatch = eligible.filter(j => j.match !== null && j.match >= 60);
  const excludedCount = allJobs.length - eligible.length;
  const hasSkills = profile.skills && profile.skills.length > 0;

  document.getElementById('last-collected').textContent = allJobs.length
    ? `${allJobs.length} vagas coletadas no total`
    : 'Nenhuma vaga coletada ainda — rode o coletor.';

  document.getElementById('stats-cards').innerHTML = `
    <div class="card"><div class="label">Vagas coletadas</div><div class="value">${allJobs.length}</div></div>
    <div class="card"><div class="label">Elegíveis (política)</div><div class="value">${eligible.length}</div></div>
    <div class="card"><div class="label">Alta compatibilidade</div><div class="value">${hasSkills ? highMatch.length : '—'}</div></div>
    <div class="card"><div class="label">Fora da política</div><div class="value">${excludedCount}</div></div>
  `;

  const hint = document.getElementById('recommended-hint');
  const grid = document.getElementById('recommended-grid');

  // Presencial já vem sinalizado como "fora da preferência" (onsite_policy) quando
  // configurado — por isso o ranking usa modalidade como critério primário e match
  // como desempate, em vez de só match bruto. Sem isso, vaga presencial com 1 palavra-
  // chave batendo aparecia antes de vaga remota igualmente compatível.
  const WORKPLACE_RANK = { remote: 0, hybrid: 1, null: 2, undefined: 2, 'on-site': 3 };

  let recommended;
  if (hasSkills) {
    recommended = compatible.slice().sort((a, b) => {
      const rankDiff = WORKPLACE_RANK[a.workplace_type] - WORKPLACE_RANK[b.workplace_type];
      return rankDiff !== 0 ? rankDiff : b.match - a.match;
    }).slice(0, 6);
    hint.textContent = 'Priorizando modalidade aceita (Configurações) e, dentro dela, % de match com suas skills.';
  } else {
    recommended = eligible.slice().sort((a, b) => new Date(b.published_date) - new Date(a.published_date)).slice(0, 6);
    hint.textContent = 'Cadastre skills no Perfil pra calcular compatibilidade — por enquanto, mostrando as mais recentes.';
  }

  if (!recommended.length) {
    grid.innerHTML = '<div class="empty-recommended">Nenhuma vaga elegível ainda. Rode o coletor ou revise a política em Configurações.</div>';
    return;
  }

  grid.innerHTML = recommended.map(j => `
    <div class="job-card ${j.match >= 60 ? 'tier-high' : j.match >= 30 ? 'tier-mid' : ''}">
      <a class="jc-title" href="${j.url}" target="_blank" rel="noopener">${j.title}</a>
      <div class="jc-company">${j.company || 'Empresa não informada'} · ${[j.city, j.state].filter(Boolean).join(' / ') || 'Local não informado'}</div>
      <div class="jc-tags">
        <span class="tag">${j.contract_label}</span>
        <span class="tag">${j.workplace_label}</span>
        <span class="tag muted">${j.seniority_label}</span>
      </div>
      ${(j.warnings || []).map(w => `<div class="jc-warning">⚠ ${w}</div>`).join('')}
      <div class="jc-match-row">
        <div class="bar-track"><div class="bar-fill" style="width:${j.match ?? 0}%"></div></div>
        <div class="jc-match-label ${matchClass(j.match)}">${j.match === null ? '—' : j.match + '%'}</div>
      </div>
    </div>
  `).join('');
}

async function loadStats() {
  const stats = await fetch('api/stats').then(r => r.json());

  renderChart();
  renderBreakdown('contract-breakdown', stats.byContract);
  renderBreakdown('workplace-breakdown', stats.byWorkplace);
  renderBreakdown('seniority-breakdown', stats.bySeniority);

  fillSelect('f-contract', stats.byContract.map(x => [x.key, x.label]));
  fillSelect('f-workplace', stats.byWorkplace.map(x => [x.key, x.label]));
  fillSelect('f-state', stats.byState.map(x => [x.state, x.state]));
  fillSelect('f-seniority', stats.bySeniority.map(x => [x.key, x.label]));
}

async function renderChart() {
  const series = await fetch('api/timeseries?days=30').then(r => r.json());
  const w = 900, h = 180, padL = 34, padR = 16, padT = 16, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max(...series.map(p => p.count), 4);

  const x = (i) => padL + (i / (series.length - 1)) * innerW;
  const y = (v) => padT + innerH - (v / max) * innerH;

  const linePoints = series.map((p, i) => `${x(i)},${y(p.count)}`).join(' ');
  const areaPoints = `${padL},${padT + innerH} ${linePoints} ${padL + innerW},${padT + innerH}`;

  const ySteps = 4;
  const gridlines = Array.from({ length: ySteps + 1 }, (_, i) => {
    const val = Math.round((max / ySteps) * i);
    const yy = y(val);
    return `
      <line x1="${padL}" y1="${yy}" x2="${padL + innerW}" y2="${yy}" stroke="#1a212c" stroke-width="1" />
      <text x="${padL - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#8b98a5">${val}</text>
    `;
  }).join('');

  const labelEvery = Math.ceil(series.length / 10);
  const xLabels = series.map((p, i) => {
    if (i % labelEvery !== 0 && i !== series.length - 1) return '';
    const d = new Date(p.date + 'T00:00:00Z');
    const label = d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
    return `<text x="${x(i)}" y="${h - 6}" text-anchor="middle" font-size="11" fill="#8b98a5">${label}</text>`;
  }).join('');

  const dots = series.map((p, i) => `
    <circle class="chart-dot" data-i="${i}" cx="${x(i)}" cy="${y(p.count)}" r="3" fill="#2dd4a7" />
    <circle class="chart-hit" data-i="${i}" cx="${x(i)}" cy="${y(p.count)}" r="10" fill="transparent" style="cursor:pointer" />
  `).join('');

  document.getElementById('chart-wrap').innerHTML = `
    <div style="position:relative">
      <svg id="chart-svg" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
        ${gridlines}
        <polygon points="${areaPoints}" fill="rgba(45,212,167,0.12)" stroke="none" />
        <polyline points="${linePoints}" fill="none" stroke="#2dd4a7" stroke-width="2" />
        <line id="chart-guide" x1="0" y1="${padT}" x2="0" y2="${padT + innerH}" stroke="#2dd4a7" stroke-width="1" stroke-dasharray="3,3" opacity="0" />
        ${dots}
      </svg>
      ${xLabels ? `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="position:absolute;top:0;left:0;pointer-events:none">${xLabels}</svg>` : ''}
      <div id="chart-tooltip" style="position:absolute;display:none;pointer-events:none;background:#0e141c;border:1px solid #1f2733;border-radius:8px;padding:6px 10px;font-size:12px;color:#e6edf3;white-space:nowrap;transform:translate(-50%,-115%)"></div>
    </div>
  `;

  const svg = document.getElementById('chart-svg');
  const tooltip = document.getElementById('chart-tooltip');
  const guide = document.getElementById('chart-guide');

  svg.querySelectorAll('.chart-hit').forEach((hit) => {
    hit.addEventListener('mouseenter', () => {
      const i = Number(hit.dataset.i);
      const p = series[i];
      const d = new Date(p.date + 'T00:00:00Z');
      const label = d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
      tooltip.textContent = `${label}: ${p.count} vaga${p.count === 1 ? '' : 's'}`;
      tooltip.style.display = 'block';
      const px = (x(i) / w) * 100;
      tooltip.style.left = px + '%';
      tooltip.style.top = (y(p.count) / h) * 100 + '%';
      guide.setAttribute('x1', x(i));
      guide.setAttribute('x2', x(i));
      guide.setAttribute('opacity', '1');
      svg.querySelectorAll('.chart-dot').forEach((d2) => d2.setAttribute('r', d2.dataset.i === hit.dataset.i ? '5' : '3'));
    });
    hit.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
      guide.setAttribute('opacity', '0');
      svg.querySelectorAll('.chart-dot').forEach((d2) => d2.setAttribute('r', '3'));
    });
  });
}

function renderBreakdown(elId, items) {
  const max = Math.max(...items.map(i => i.count), 1);
  document.getElementById(elId).innerHTML = items.map(i => `
    <div class="bar-row">
      <div class="name">${i.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(i.count / max) * 100}%"></div></div>
      <div class="count">${i.count}</div>
    </div>
  `).join('');
}

function fillSelect(id, pairs) {
  const el = document.getElementById(id);
  const current = el.value;
  const placeholder = el.options[0];
  el.innerHTML = '';
  el.appendChild(placeholder);
  for (const [value, label] of pairs) {
    if (!value || value === 'nao_identificado') continue;
    const opt = document.createElement('option');
    opt.value = value; opt.textContent = label;
    el.appendChild(opt);
  }
  el.value = current;
}

let CURRENT_TAB = 'all';
let CURRENT_PAGE = 1;
const PAGE_SIZE = 30;

async function toggleApplied(jobId, makeApplied, btn) {
  btn.disabled = true;
  try {
    if (makeApplied) {
      await fetch(`api/jobs/${encodeURIComponent(jobId)}/mark-applied`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile_id: PROFILE_ID })
      });
    } else {
      await fetch(`api/jobs/${encodeURIComponent(jobId)}/mark-applied`, { method: 'DELETE' });
    }
    await loadJobs();
  } finally {
    btn.disabled = false;
  }
}

function renderPagination(page, totalPages) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button class="btn" id="pg-prev" type="button" ${page <= 1 ? 'disabled' : ''}>← Anterior</button>
    <span class="pg-label">Página ${page} de ${totalPages}</span>
    <button class="btn" id="pg-next" type="button" ${page >= totalPages ? 'disabled' : ''}>Próxima →</button>
  `;
  document.getElementById('pg-prev')?.addEventListener('click', () => { CURRENT_PAGE = Math.max(1, page - 1); loadJobs(); });
  document.getElementById('pg-next')?.addEventListener('click', () => { CURRENT_PAGE = page + 1; loadJobs(); });
}

async function loadJobs() {
  const params = new URLSearchParams();
  params.set('profile_id', PROFILE_ID);
  const q = document.getElementById('q').value.trim();
  const contract = document.getElementById('f-contract').value;
  const workplace = document.getElementById('f-workplace').value;
  const state = document.getElementById('f-state').value;
  const seniority = document.getElementById('f-seniority').value;
  if (q) params.set('q', q);
  if (contract) params.set('contract_type', contract);
  if (workplace) params.set('workplace_type', workplace);
  if (state) params.set('state', state);
  if (seniority) params.set('seniority', seniority);

  if (CURRENT_TAB === 'applied') {
    params.set('applied', '1');
  } else if (document.getElementById('show-all').checked) {
    params.set('show_all', '1');
  }
  params.set('page', CURRENT_PAGE);
  params.set('page_size', PAGE_SIZE);

  const { items: jobs, page, total_pages } = await fetch('api/jobs?' + params.toString()).then(r => r.json());
  const body = document.getElementById('jobs-body');

  if (!jobs.length) {
    body.innerHTML = `<tr><td colspan="9" class="empty">${CURRENT_TAB === 'applied' ? 'Nenhuma candidatura marcada como enviada ainda.' : 'Nenhuma vaga encontrada com esses filtros.'}</td></tr>`;
    renderPagination(1, 1);
    return;
  }

  body.innerHTML = jobs.map(j => `
    <tr style="${j.excluded_by_policy ? 'opacity:0.55' : ''}">
      <td>
        <a class="job-link" href="${j.url}" target="_blank" rel="noopener">${j.title}</a>
        ${j.applied ? '<div class="hint">✓ Candidatura enviada</div>' : ''}
        ${j.excluded_by_policy ? '<div class="hint">Fora da política de Configurações</div>' : ''}
        ${(j.warnings || []).map(w => `<div class="hint">⚠ ${w}</div>`).join('')}
      </td>
      <td>${j.company || '—'}</td>
      <td><span class="tag">${j.contract_label}</span></td>
      <td><span class="tag">${j.workplace_label}</span></td>
      <td><span class="tag muted">${j.seniority_label}</span></td>
      <td>${[j.city, j.state].filter(Boolean).join(' / ') || '—'}</td>
      <td>${j.published_date ? new Date(j.published_date).toLocaleDateString('pt-BR') : '—'}</td>
      <td class="match ${matchClass(j.match)}">${j.match === null ? '—' : j.match + '%'}</td>
      <td><button class="btn btn-mark" data-job-id="${j.id}" data-applied="${j.applied ? '1' : '0'}" type="button">${j.applied ? 'Desmarcar' : 'Marcar enviada'}</button></td>
    </tr>
  `).join('');

  body.querySelectorAll('.btn-mark').forEach(btn => {
    btn.addEventListener('click', () => toggleApplied(btn.dataset.jobId, btn.dataset.applied === '0', btn));
  });

  renderPagination(page, total_pages);
}

['q', 'f-contract', 'f-workplace', 'f-state', 'f-seniority', 'show-all'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { CURRENT_PAGE = 1; loadJobs(); });
  document.getElementById(id).addEventListener('change', () => { CURRENT_PAGE = 1; loadJobs(); });
});

document.querySelectorAll('#jobs-tabs .tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#jobs-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    CURRENT_TAB = btn.dataset.tab;
    CURRENT_PAGE = 1;
    document.getElementById('show-all-wrap').style.display = CURRENT_TAB === 'applied' ? 'none' : 'flex';
    loadJobs();
  });
});

function trySetSelect(id, value) {
  if (!value) return false;
  const el = document.getElementById(id);
  const match = [...el.options].find(o => o.value.toLowerCase() === String(value).toLowerCase());
  if (match) { el.value = match.value; return true; }
  return false;
}

async function runPromptFilter() {
  const prompt = document.getElementById('prompt-input').value.trim();
  const status = document.getElementById('prompt-status');
  const applied = document.getElementById('prompt-applied');
  if (!prompt) return;

  status.textContent = 'Interpretando com IA...';
  applied.innerHTML = '';
  try {
    const filters = await fetch('api/jobs/parse-prompt', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt })
    }).then(r => {
      if (!r.ok) return r.json().then(e => { throw new Error(e.error || 'Falha ao interpretar'); });
      return r.json();
    });

    document.getElementById('q').value = filters.keywords || '';
    const okContract = trySetSelect('f-contract', filters.contract_type);
    const okWorkplace = trySetSelect('f-workplace', filters.workplace_type);
    const okSeniority = trySetSelect('f-seniority', filters.seniority);
    const okState = trySetSelect('f-state', filters.state);

    const tags = [];
    if (filters.keywords) tags.push(`termo: "${filters.keywords}"`);
    if (okContract) tags.push('contrato ✓'); else if (filters.contract_type) tags.push('contrato: sem correspondência nos dados coletados');
    if (okWorkplace) tags.push('modalidade ✓'); else if (filters.workplace_type) tags.push('modalidade: sem correspondência');
    if (okSeniority) tags.push('senioridade ✓'); else if (filters.seniority) tags.push('senioridade: sem correspondência');
    if (okState) tags.push('estado ✓'); else if (filters.state) tags.push(`estado "${filters.state}": sem vagas coletadas`);

    applied.innerHTML = tags.length ? `<span class="hint">Aplicado: ${tags.join(' · ')}</span>` : '<span class="hint">Nenhum filtro específico identificado — busquei só pelo termo.</span>';
    status.textContent = '';
    loadJobs();
  } catch (err) {
    status.textContent = 'Erro: ' + err.message;
  }
}

document.getElementById('prompt-go').addEventListener('click', runPromptFilter);
document.getElementById('prompt-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); runPromptFilter(); }
});

(async () => {
  PROFILE_ID = await initProfileSwitcher();
  if (!PROFILE_ID) return;
  await loadHero();
  await loadStats();
  await loadJobs();
})();
</script>
</body>
</html>
