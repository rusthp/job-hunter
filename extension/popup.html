<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Job Hunter</title>
<style>
  body { width: 300px; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #121821; color: #e6edf3; margin: 0; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #8b98a5; margin: 10px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; background: #0e141c; border: 1px solid #1f2733; color: #e6edf3; padding: 7px 8px; border-radius: 6px; font-size: 13px; }
  button { margin-top: 14px; width: 100%; background: #2dd4a7; color: #04231a; border: none; border-radius: 6px; padding: 9px; font-weight: 600; cursor: pointer; }
  .status { margin-top: 8px; font-size: 12px; color: #8b98a5; }
</style>
</head>
<body>
  <h1>Job Hunter — Configuração</h1>

  <label for="serverUrl">URL do servidor</label>
  <input id="serverUrl" type="text" placeholder="http://178.18.250.39/job-hunter" />

  <label for="authUser">Usuário (basic auth)</label>
  <input id="authUser" type="text" placeholder="ally" />

  <label for="authPass">Senha</label>
  <input id="authPass" type="password" />

  <label for="profileId">Perfil ativo</label>
  <select id="profileId"><option value="">Carregar perfis primeiro...</option></select>

  <button id="loadProfiles">Buscar perfis</button>
  <button id="save">Salvar</button>
  <div class="status" id="status"></div>

<script src="popup.js"></script>
</body>
</html>
